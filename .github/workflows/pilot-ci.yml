name: Client Pilot CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poc/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret scan
        run: |
          ! grep -RInE "sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude="*.md"
